name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r .version manifest.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}-${{ github.run_number }}"
          COMMIT_MSG=$(git log -1 --pretty=%s)

          STAGE=feedwatch
          mkdir -p "$STAGE"
          cp manifest.json background.js parser.js store.js \
            popup.html popup.css popup.js LICENSE README.md "$STAGE/"
          cp -R icons "$STAGE/icons"
          zip -r feedwatch.zip "$STAGE"

          NOTES=$(cat <<EOF
          **FeedWatch ${VERSION}** (build ${{ github.run_number }})

          Commit: ${SHORT_SHA} — ${COMMIT_MSG}

          ### Install
          1. Download **feedwatch.zip** (not the Source code archives)
          2. Unzip it
          3. Chrome → \`chrome://extensions\` → Developer mode → **Load unpacked** → select the \`feedwatch\` folder
          EOF
          )
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')

          gh release create "$TAG" feedwatch.zip \
            --title "FeedWatch ${VERSION}" \
            --notes "$NOTES" \
            --latest \
            --target "$GITHUB_SHA"
